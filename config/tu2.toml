# Same day, the full audit (every pointer into code in the data, every lis+addi address in the code, the
# .pdata entries) found three more that a call could reach: 0x825CC2E8 (li r3,0; blr after the
# no-return bl ending sub_825CC2B8, in a table of callbacks and names at 0x821E1FAC), 0x82718398 and
# 0x827183A8 (vector routines whose addresses getters return, lis+addi r3; blr at 0x82718FA0, beside
# the registered 0x82718290). The rest are jump tables, return addresses, SEH/C++ EH scope tables and
# catch continuations, imports, the save/restore helpers codegen inlines, and dead code (0x826B1E60,
# in .pdata but never referenced).
