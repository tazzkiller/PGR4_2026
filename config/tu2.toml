0x82718398 = {}
0x827183A8 = {}

# Game patches, as mid-asm hooks (games/pgr4/src/pgr4_hooks.cpp). Each address is an instruction of
# Title Update #2; codegen emits the call before it, or after it with after_instruction.

# KickOffEx (sub_826CACA0) loads the presentation interval from the device (lwz r10,13580(r31)).
# The native renderer paces frames on the display, so the guest presents immediately.
[[midasm_hook]]
address = 0x826CAD54
name = "Pgr4PresentationIntervalHook"
registers = ["r10"]
after_instruction = true

# A car's drawn pose (sub_82445CB8): the bounds of its fraction's range (0.001, 0.999), loaded
# before each is compared with the fraction (f31), moved out of the way to let the game's mix run
# past its range (pgr4_vehicle_pose_extend, src/pgr4_hooks.cpp).
[[midasm_hook]]
address = 0x82445DE8  # lfs f0,-30100(r11)
name = "Pgr4PoseLowBoundHook"
registers = ["f0"]
after_instruction = true

[[midasm_hook]]
address = 0x82445E2C  # lfs f0,-17216(r11)
name = "Pgr4PoseHighBoundHook"
registers = ["f0"]
after_instruction = true

# A ragdoll's step (sub_824B6438): the 30 of its fixed 1 / (N x 30) s (0x821AC658), made 1 / the
# frame's time it is given in f1 (pgr4_character_ragdoll_time, src/pgr4_hooks.cpp).
[[midasm_hook]]
address = 0x824B6480  # lfs f0,-14760(r10)
name = "Pgr4RagdollRateHook"
registers = ["f0", "f1"]
after_instruction = true

# Motion blur pass (sub_82859FC0): fmuls f0,f0,f13 is the per-sample step (c159), tuned for 30 FPS.
[[midasm_hook]]
address = 0x8285A758
name = "Pgr4MotionBlurStepHook"
registers = ["f0"]
after_instruction = true

# Cockpit camera (sub_827DA5C0): the driver's head turns toward the car's orientation by
# slerp(old, target, Camera.Dash.HeadAmount 0.25) each frame, tuned on the console's 30 FPS. The
# lvlx that loads it reads from a copy with the factor per real frame (Pgr4DashHeadHook).
[[midasm_hook]]
address = 0x827DA81C  # lvlx v13,r10,r8 (r10: the variable, its value at +32)
name = "Pgr4DashHeadHook"
registers = ["r10"]

# Cockpit free look with the right stick: sub_827DA960 turns the head by stick x 0.0349 rad each
# frame, sub_827DB248 moves its look angles 0.75 of the way to the stick's each frame; both per
# 30 FPS frame (Pgr4DashLookStepHook, Pgr4DashLookLerpHook).
[[midasm_hook]]
address = 0x827DA9A0  # lfs f0,7032(r11)
name = "Pgr4DashLookStepHook"
registers = ["f0"]
after_instruction = true

[[midasm_hook]]
address = 0x827DB2F0  # lfs f13,4252(r11)
name = "Pgr4DashLookLerpHook"
registers = ["f13"]
after_instruction = true

# Camera shake (sub_827DD588, Camera.Shake.*): its intensity is 0.01 x (displacement + angle)
# / the frame's time (+284), clamped to 0.5, smoothed 0.1 / 0.9 per frame into +1536.
# Its three angles (f30, f29, f28: the noise times the amplitude), final once the phase is stored:
# scaled by pgr4_camera_shake_scale.
[[midasm_hook]]
address = 0x827DD85C  # stw r11,1532(r31)
name = "Pgr4CameraShakeScaleHook"
registers = ["f30", "f29", "f28"]
after_instruction = true

