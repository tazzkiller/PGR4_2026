# Local change (pgr4 project, 14/11/2026): vtable methods codegen does not reach, found by scanning the
# data for pointers into code that follow a function end (blr, bctr, b) in a table of registered
# functions. 0x8252CCF8 (li r3,1; blr, vtable at 0x821BF980) crashed a player's race load with
# "Call to invalid or unregistered function"; the five others are the same case.
